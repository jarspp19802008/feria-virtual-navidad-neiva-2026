<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · Feria Navideña de Neiva 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Manrope,Arial,sans-serif;color:#20332a;background:#f7f7f0;--green:#145b3d;--red:#a72f3b;--muted:#65736b;--paper:#fffefa;--border:#e2e8df}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{color:var(--green);font-weight:800;text-decoration:none}.btn{border:0;border-radius:999px;background:var(--green);color:white;padding:11px 16px;font:700 13px Manrope,Arial;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--green)}h1{font-size:clamp(26px,5vw,38px);line-height:1.12;margin:28px 0 8px;color:var(--green)}p{color:var(--muted);line-height:1.6}#status{padding:12px 14px;background:#edf2e9;border-radius:12px;font-size:13px}.list{display:grid;gap:13px;margin-top:20px}.item{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 6px 20px #174b3b0c}.item h2{font-size:18px;margin:0 0 8px;color:#541d32}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eef3ec;border-radius:99px;padding:5px 9px;font-size:11px;color:#315b43;font-weight:700}.item p{margin:9px 0;font-size:13px}.item a{color:var(--green);overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.approve{background:var(--green)}.reject{background:var(--red)}.empty{padding:25px;text-align:center;border:1px dashed #cbd7c9;border-radius:14px;color:var(--muted)}.hidden{display:none!important}img.preview{max-width:220px;max-height:150px;object-fit:cover;border-radius:10px;display:block;margin-top:10px}
</style></head>
<body><main class="wrap"><div class="top"><a class="brand" href="./">← Feria Navideña de Neiva</a><div><button id="login" class="btn">Ingresar con Google</button> <button id="logout" class="btn ghost hidden">Cerrar sesión</button></div></div><h1>Revisión de inscripciones</h1><p>Solo la cuenta autorizada puede consultar y aprobar las solicitudes. Al aprobar, el comercio aparecerá en la feria pública.</p><div id="status" role="status" aria-live="polite">Verificando acceso…</div><section id="applications" class="list" aria-live="polite"></section></main>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyCyYzK4mA8jpbpHqQ9Vmfgsint9W5vVuXc',authDomain:'ferianavidadneiva2026.firebaseapp.com',databaseURL:'https://ferianavidadneiva2026-default-rtdb.firebaseio.com',projectId:'ferianavidadneiva2026',storageBucket:'ferianavidadneiva2026.firebasestorage.app',messagingSenderId:'15766217181',appId:'1:15766217181:web:5fe299a2066f0b775fd634'};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database(),ADMIN='jarspp19802008@gmail.com';const status=document.getElementById('status'),list=document.getElementById('applications'),login=document.getElementById('login'),logout=document.getElementById('logout');let listener=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
login.onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(error=>{status.textContent='No se pudo iniciar sesión: '+error.message});logout.onclick=()=>auth.signOut();
auth.onAuthStateChanged(user=>{if(listener){db.ref('merchantApplications').off('value',listener);listener=null}list.replaceChildren();if(!user){status.textContent='Inicia sesión con la cuenta autorizada para revisar las solicitudes.';login.classList.remove('hidden');logout.classList.add('hidden');return}if(user.email!==ADMIN||!user.emailVerified){status.textContent='Esta cuenta no tiene permiso para administrar la feria.';login.classList.add('hidden');logout.classList.remove('hidden');return}login.classList.add('hidden');logout.classList.remove('hidden');status.textContent='Sesión de administración activa: '+user.email+'. Cargando solicitudes…';listener=snapshot=>{const pending=[];snapshot.forEach(child=>{const item=child.val();if(item.status==='pending')pending.push({id:child.key,...item})});pending.reverse();status.textContent='Solicitudes pendientes: '+pending.length;list.innerHTML=pending.length?pending.map(item=>`<article class="item"><div class="meta"><span class="pill">${esc(item.cat)}</span><span class="pill">Pendiente</span></div><h2>${esc(item.name)}</h2><p>${esc(item.desc)}</p><p><b>Dirección:</b> ${esc(item.addr)}<br><b>WhatsApp:</b> ${esc(item.whatsapp)}</p><p>${item.instagram?`Instagram: ${esc(item.instagram)}<br>`:''}${item.facebook?`Facebook: ${esc(item.facebook)}<br>`:''}${item.tiktok?`TikTok: ${esc(item.tiktok)}`:''}</p>${item.photoUrl&&/^https:\/\//i.test(item.photoUrl)?`<p><b>Foto:</b> <a href="${esc(item.photoUrl)}" target="_blank" rel="noopener">Abrir foto</a></p><img class="preview" src="${esc(item.photoUrl)}" alt="Foto enviada por ${esc(item.name)}">`:''}<div class="actions"><button class="btn approve" data-action="approve" data-id="${esc(item.id)}">Aprobar y publicar</button><button class="btn reject" data-action="reject" data-id="${esc(item.id)}">Rechazar</button></div></article>`).join(''):'<div class="empty">No hay solicitudes pendientes.</div>'};db.ref('merchantApplications').on('value',listener,error=>{status.textContent='No se pudieron cargar las solicitudes. Revisa las reglas de acceso de Firebase.';console.error(error)})});
list.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button)return;const id=button.dataset.id;button.disabled=true;try{const ref=db.ref('merchantApplications/'+id),snapshot=await ref.once('value'),application=snapshot.val();if(!application||application.status!=='pending')throw new Error('La solicitud ya fue revisada.');const updates={};updates['merchantApplications/'+id+'/status']=button.dataset.action==='approve'?'approved':'rejected';if(button.dataset.action==='approve'){const {status,createdAt,submittedBy,consent,...shop}=application;updates['approvedShops/'+id]=shop}await db.ref().update(updates);status.textContent=button.dataset.action==='approve'?'Comercio aprobado y publicado.':'Solicitud rechazada.'}catch(error){status.textContent='No se pudo guardar la decisión. '+error.message;button.disabled=false}});
</script></body></html>
